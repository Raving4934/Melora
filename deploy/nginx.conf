# Melora 云部署 nginx 反向代理示例。
# 放到 nginx 的 http 块内（如 /etc/nginx/conf.d/melora.conf），把域名替换成你的；
# 证书可以用 certbot：certbot --nginx -d melora.example.com
#
# 默认 docker-compose.yml 使用 host 网络，因此本示例适用于宿主机 nginx。

# 登录接口第一道按来源 IP 限流；后端保留全局兜底，并可在配置
# MELORA_TRUSTED_PROXIES 后按真实客户端 IP 建桶。
limit_req_zone $binary_remote_addr zone=melora_auth:10m rate=10r/m;

server {
    listen 80;
    server_name melora.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name melora.example.com;

    ssl_certificate     /etc/letsencrypt/live/melora.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/melora.example.com/privkey.pem;

    # 源导入上限约 544 KiB，留出 multipart 余量。
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3780;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/auth/session {
        limit_req zone=melora_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3780;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
