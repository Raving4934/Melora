name: Android CI & Release

on:
  push:
    branches: ['**']
    tags: ['android-v*']
    paths:
      - 'android/**'
      - 'scripts/release/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'scripts/release/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: '已有 Android 标签：填写则验证并发布；留空仅运行 CI'
        type: string
        required: false
        default: ''
      api_matrix:
        description: '运行 API 26/35/37 完整设备矩阵（默认仅 API 35）'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ (github.event_name == 'push' && github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' && inputs.tag != '') && format('release-{0}', inputs.tag || github.ref_name) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' && inputs.tag != '') }}

jobs:
  prepare:
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      tag: ${{ steps.target.outputs.tag }}
      release: ${{ steps.target.outputs.release }}
    steps:
      - name: 解析检查与发布目标
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag=''
          ref="$GITHUB_SHA"
          if [[ "$EVENT_NAME" == push && "$REF_TYPE" == tag ]]; then
            tag="$REF_NAME"
          elif [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            tag="$INPUT_TAG"
          fi
          if [[ -n "$tag" ]]; then
            [[ "$tag" =~ ^android-v([0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?)$ ]] || {
              echo '::error::Expected an existing android-v<semver> tag (for example android-v0.1.0).'
              exit 1
            }
            if [[ "$EVENT_NAME" == workflow_dispatch ]]; then ref="refs/tags/$tag"; fi
            printf 'tag=%s\nrelease=true\nref=%s\n' "$tag" "$ref" >> "$GITHUB_OUTPUT"
          else
            printf 'tag=\nrelease=false\nref=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ steps.target.outputs.ref }}
          persist-credentials: false
      - name: 固定本次运行的提交
        id: commit
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI_GRADLE_JVM_ARGS: -Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:ActiveProcessorCount=2 -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android/tools/sdk/package-lock.json
      - name: 校验公开全源码 baseline
        run: |
          set -euo pipefail
          test -s android/app/build.gradle.kts
          test -s apps/server/go.mod
          test -s apps/web/package.json
          python3 -B scripts/release/verify_public_repository.py
      - name: 校验目录 SDK 测试与打包产物一致性
        working-directory: android/tools/sdk
        run: |
          npm ci --ignore-scripts
          npm run check
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/gradle.properties
            android/gradle/*.toml
            android/gradle/wrapper/gradle-wrapper.properties
            android/**/build.gradle*
      - uses: android-actions/setup-android@v3.2.2
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: 安装项目声明的 Android SDK 与 NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: 校验 Android 发布脚本
        run: |
          set -euo pipefail
          python3 -B scripts/release/test_verify_public_repository.py
          python3 -B scripts/release/test_verify_android_apk.py
          python3 -B scripts/release/test_licenses.py
          python3 -B scripts/release/test_export_changelog_section.py
          python3 -B scripts/release/test_github_api.py
          python3 -B scripts/release/test_publish_android_release.py
          python3 -B scripts/release/test_release_workflows.py
      - name: 执行 Android 单元测试与 lint
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --build-cache --max-workers=1 \
            -Dorg.gradle.jvmargs="$CI_GRADLE_JVM_ARGS" :app:testDebugUnitTest
          ./gradlew --no-daemon --build-cache --max-workers=1 \
            -Dorg.gradle.jvmargs="$CI_GRADLE_JVM_ARGS" :app:lintDebug
      - name: 汇总 Android 单元测试结果
        if: always()
        shell: bash
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path("android/app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"))
          if not reports:
              raise SystemExit("No Android unit-test XML results were produced.")
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in reports:
              suite = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, "0"))
          print(f"Android tests: suites={len(reports)}, {totals}")
          if not totals["tests"] or totals["failures"] or totals["errors"]:
              raise SystemExit("Android unit-test verification failed.")
          PYTEST
      - name: 保留失败的单元测试与 Debug lint 诊断
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: android-verify-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 3
      - name: 构建 Debug APK（仅 CI 验证，不用于发布）
        if: needs.prepare.outputs.release != 'true'
        working-directory: android
        run: >-
          ./gradlew --no-daemon --build-cache --max-workers=2
          -Dorg.gradle.jvmargs="$CI_GRADLE_JVM_ARGS" :app:assembleDebug
      - name: 上传短期 Debug 诊断产物
        if: needs.prepare.outputs.release != 'true'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3

  device-regression:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.api_matrix && '[26,35,37]' || '[35]') }}
        shard: [0, 1]
    defaults:
      run:
        shell: bash
    env:
      API_LEVEL: ${{ matrix.api }}
      TEST_SHARD_INDEX: ${{ matrix.shard }}
      TEST_SHARD_COUNT: 2
      ANDROID_SERIAL: emulator-5554
      CI_GRADLE_JVM_ARGS: -Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:ActiveProcessorCount=2 -Dfile.encoding=UTF-8
    steps:
      - name: 初始化设备诊断目录
        run: |
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/melora-avd-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${API_LEVEL}-${TEST_SHARD_INDEX}" >> "$GITHUB_ENV"
          echo "DEVICE_LOG_DIR=$RUNNER_TEMP/melora-device-${API_LEVEL}-${TEST_SHARD_INDEX}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/gradle.properties
            android/gradle/*.toml
            android/gradle/wrapper/gradle-wrapper.properties
            android/**/build.gradle*
      - uses: android-actions/setup-android@v3.2.2
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: 准备设备 SDK 与全新 AVD
        run: |
          set -euo pipefail
          mkdir -p "$DEVICE_LOG_DIR"
          image_api="$API_LEVEL"
          # 官方 API 37 基础镜像使用 37.0 包路径，不回退到预览版或其他 API。
          if [[ "$API_LEVEL" == 37 ]]; then image_api=37.0; fi
          image="system-images;android-${image_api};google_apis;x86_64"
          sdkmanager --list --channel=0 > "$DEVICE_LOG_DIR/sdk-packages.log" 2>&1
          # sdkmanager 旧输出用分号，新 Android CLI 用斜杠；仅匹配完整包 ID。
          python3 - "$DEVICE_LOG_DIR/sdk-packages.log" "$image" <<'PYSDK'
          from pathlib import Path
          import sys
          expected = sys.argv[2].replace(";", "/")
          for line in Path(sys.argv[1]).read_text().splitlines():
              fields = line.split()
              if fields and fields[0].replace(";", "/") == expected:
                  print(line)
                  break
          else:
              raise SystemExit(f"Required Android SDK package not found: {sys.argv[2]}")
          PYSDK
          (set +o pipefail; yes | sdkmanager --licenses > "$DEVICE_LOG_DIR/sdk-licenses.log" 2>&1)
          sdkmanager --channel=0 'platforms;android-37.0' 'ndk;28.2.13676358' 'cmake;3.22.1' 'emulator' "$image" \
            2>&1 | tee "$DEVICE_LOG_DIR/sdk-install.log"
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          # 每个 job 从空目录创建可写 AVD；不恢复 AVD 缓存或既有数据盘。
          test ! -e "$ANDROID_AVD_HOME"
          mkdir "$ANDROID_AVD_HOME"
          printf 'no\n' | avdmanager create avd --name melora-ci --package "$image" \
            --path "$ANDROID_AVD_HOME/melora-ci.avd" --device pixel_2 \
            2>&1 | tee "$DEVICE_LOG_DIR/avd-create.log"
      - name: 构建设备测试 APK
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --build-cache --max-workers=1 \
            -Dorg.gradle.jvmargs="$CI_GRADLE_JVM_ARGS" -Pmelora.debugAbi=x86_64 \
            :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee "$DEVICE_LOG_DIR/build.log"
      - name: 启动并校验独立模拟器
        run: |
          set -euo pipefail
          # 保留真实 GLES 渲染与动画，改走 ANGLE，避开已复现的直接 SwiftShader GLES
          # ColorBuffer/纹理绑定异常；不能通过关闭 GPU 或跳过沉浸测试掩盖设备失联。
          nohup "$ANDROID_HOME/emulator/emulator" -avd melora-ci -port 5554 \
            -no-window -no-audio -no-boot-anim -no-snapshot -gpu swangle \
            -accel on -cores 2 -memory 2048 > "$DEVICE_LOG_DIR/emulator.log" 2>&1 &
          echo $! > "$DEVICE_LOG_DIR/emulator.pid"
          timeout 360 bash -c '
            set -euo pipefail
            adb -s "$ANDROID_SERIAL" wait-for-device
            until [[ "$(adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do
              sleep 2
            done
          '
          test "$(adb -s "$ANDROID_SERIAL" shell getprop ro.build.version.sdk | tr -d '\r')" = "$API_LEVEL"
          test "$(adb -s "$ANDROID_SERIAL" shell getprop ro.product.cpu.abi | tr -d '\r')" = x86_64
          adb devices | tee "$DEVICE_LOG_DIR/devices.log"
          test "$(adb devices | awk 'NR > 1 && NF {print $1}')" = "$ANDROID_SERIAL"
          adb -s "$ANDROID_SERIAL" shell input keyevent 82
          # 编辑弹窗回归必须覆盖真实IME，即使AVD声明了硬件键盘也要允许软键盘显示。
          adb -s "$ANDROID_SERIAL" shell settings put secure show_ime_with_hard_keyboard 1
          # 动画回归需要真实时间比例，不能用关闭系统动画掩盖中断/回弹问题。
          for scale in window_animation_scale transition_animation_scale animator_duration_scale; do
            adb -s "$ANDROID_SERIAL" shell settings put global "$scale" 1
          done
          nohup adb -s "$ANDROID_SERIAL" logcat -v threadtime > "$DEVICE_LOG_DIR/logcat.log" 2>&1 &
          echo $! > "$DEVICE_LOG_DIR/logcat.pid"
      - name: 安装测试目标并预置 overlay 权限
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --build-cache --max-workers=1 \
            -Dorg.gradle.jvmargs="$CI_GRADLE_JVM_ARGS" -Pmelora.debugAbi=x86_64 \
            :app:installDebug 2>&1 | tee "$DEVICE_LOG_DIR/install.log"
          # BackupRoundTripTest 的 overlay 前置条件只授予目标 debug 包，不授予测试 APK。
          adb -s "$ANDROID_SERIAL" shell appops set --uid com.leyu.melora.debug SYSTEM_ALERT_WINDOW allow
          adb -s "$ANDROID_SERIAL" shell appops get com.leyu.melora.debug SYSTEM_ALERT_WINDOW \
            | tee "$DEVICE_LOG_DIR/overlay.log" | grep -F 'SYSTEM_ALERT_WINDOW: allow'
      - name: 执行完整 Android 设备回归
        working-directory: android
        timeout-minutes: 30
        run: |
          set -euo pipefail
          rm -rf app/build/outputs/androidTest-results/connected app/build/reports/androidTests/connected
          # runner 自动发现全部测试，再按原生分片划分到两个独立设备。
          # 不过滤测试类、不放宽30分钟上限，避免完整串行回归挤占报告收尾时间。
          ./gradlew --no-daemon --build-cache --max-workers=1 \
            -Dorg.gradle.jvmargs="$CI_GRADLE_JVM_ARGS" -Pmelora.debugAbi=x86_64 \
            -Pandroid.testInstrumentationRunnerArguments.numShards="$TEST_SHARD_COUNT" \
            -Pandroid.testInstrumentationRunnerArguments.shardIndex="$TEST_SHARD_INDEX" \
            :app:connectedDebugAndroidTest 2>&1 | tee "$DEVICE_LOG_DIR/connected-tests.log"
      - name: 校验 Android 设备 JUnit 结果
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$DEVICE_LOG_DIR"
          python3 -B - <<'PYTEST' 2>&1 | tee "$DEVICE_LOG_DIR/junit-summary.log"
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = sorted(Path("android/app/build/outputs/androidTest-results/connected").rglob("TEST-*.xml"))
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          suite_failed = False
          for path in reports:
              root = ET.parse(path).getroot()
              for suite in root.iter():
                  if suite.tag in ("testsuite", "testsuites") and any(int(suite.get(key, "0")) for key in ("failures", "errors")):
                      suite_failed = True
                      print(f"JUnit suite failure: {path.name}: {suite.attrib}")
              for case in root.iter("testcase"):
                  totals["tests"] += 1
                  for tag, key in (("failure", "failures"), ("error", "errors"), ("skipped", "skipped")):
                      issues = case.findall(tag)
                      totals[key] += bool(issues)
                      if tag != "skipped":
                          for issue in issues:
                              print(f"{tag.upper()} {case.get('classname', '')}#{case.get('name', '')}: "
                                    f"{issue.get('message', '')} {issue.text or ''}")
          executed = totals["tests"] - totals["skipped"]
          print(f"Android device tests: reports={len(reports)}, executed={executed}, {totals}")
          if not reports or not executed or totals["failures"] or totals["errors"] or suite_failed:
              raise SystemExit("Android device-test verification failed (missing/empty/skipped-only/failing results).")
          PYTEST
      - name: 收集设备诊断并清理模拟器
        if: always()
        timeout-minutes: 3
        run: |
          set -euo pipefail
          mkdir -p "$DEVICE_LOG_DIR"
          if [[ -s "$DEVICE_LOG_DIR/emulator.pid" ]]; then
            timeout 15 adb -s "$ANDROID_SERIAL" shell getprop > "$DEVICE_LOG_DIR/device-properties.log" 2>&1 || true
            timeout 15 adb -s "$ANDROID_SERIAL" logcat -d -v threadtime > "$DEVICE_LOG_DIR/logcat-final.log" 2>&1 || true
            timeout 10 adb -s "$ANDROID_SERIAL" emu kill > "$DEVICE_LOG_DIR/emulator-stop.log" 2>&1 || true
          fi
          for process in logcat emulator; do
            if [[ -s "$DEVICE_LOG_DIR/$process.pid" ]]; then
              pid="$(cat "$DEVICE_LOG_DIR/$process.pid")"
              kill "$pid" 2>/dev/null || true
              for attempt in $(seq 1 10); do
                kill -0 "$pid" 2>/dev/null || break
                sleep 1
              done
              if kill -0 "$pid" 2>/dev/null; then kill -KILL "$pid" 2>/dev/null || true; fi
            fi
          done
          rm -rf "$ANDROID_AVD_HOME"
      - name: 上传设备回归诊断
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: android-device-api${{ matrix.api }}-shard${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.DEVICE_LOG_DIR }}/
            android/app/build/outputs/androidTest-results/connected/
            android/app/build/reports/androidTests/connected/
          if-no-files-found: error
          retention-days: 3

  release-build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      version: ${{ steps.version.outputs.version }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      CI_GRADLE_JVM_ARGS: -Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:ActiveProcessorCount=2 -Dfile.encoding=UTF-8
      MELORA_KEYSTORE_BASE64: ${{ secrets.MELORA_KEYSTORE_BASE64 }}
      MELORA_KEYSTORE_PASSWORD: ${{ secrets.MELORA_KEYSTORE_PASSWORD }}
      MELORA_KEY_ALIAS: ${{ secrets.MELORA_KEY_ALIAS }}
      MELORA_KEY_PASSWORD: ${{ secrets.MELORA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/gradle.properties
            android/gradle/*.toml
            android/gradle/wrapper/gradle-wrapper.properties
            android/**/build.gradle*
      - uses: android-actions/setup-android@v3.2.2
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: 校验 Android 标签格式
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^android-v([0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::Android release tag must match android-v<semver>, for example android-v0.1.0."
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          version_code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*$/\1/p' android/app/build.gradle.kts)"
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]] || { echo '::error::Missing unique Android versionCode.'; exit 1; }
          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"
      - name: 检查 Android 发布 secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${MELORA_KEYSTORE_BASE64:-}" ]] || missing+=(MELORA_KEYSTORE_BASE64)
          [[ -n "${MELORA_KEYSTORE_PASSWORD:-}" ]] || missing+=(MELORA_KEYSTORE_PASSWORD)
          [[ -n "${MELORA_KEY_ALIAS:-}" ]] || missing+=(MELORA_KEY_ALIAS)
          [[ -n "${MELORA_KEY_PASSWORD:-}" ]] || missing+=(MELORA_KEY_PASSWORD)
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Android release blocked: missing required Actions secrets: %s. Secret values are never printed.\n' "${missing[*]}"
            exit 1
          fi
          if [[ "${MELORA_KEY_ALIAS,,}" == androiddebugkey || "${MELORA_KEY_ALIAS,,}" == androiddebug* ]]; then
            echo '::error::MELORA_KEY_ALIAS points to the Android debug key; a persistent production signing alias is required.'
            exit 1
          fi
      - name: 安装项目声明的 Android SDK 与 NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: 解码临时正式 keystore
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/melora-release.keystore"
          if ! printf '%s' "$MELORA_KEYSTORE_BASE64" | base64 --decode > "$key_path"; then
            echo '::error::MELORA_KEYSTORE_BASE64 is not valid base64.'
            exit 1
          fi
          if [[ ! -s "$key_path" ]]; then
            echo '::error::decoded Android keystore is empty.'
            exit 1
          fi
          chmod 600 "$key_path"
          echo "MELORA_KEYSTORE_PATH=${key_path}" >> "$GITHUB_ENV"
      - name: 执行 Release lint
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --build-cache --max-workers=1 \
            -Dorg.gradle.jvmargs="$CI_GRADLE_JVM_ARGS" :app:lintRelease
      - name: 保留失败的 Release lint 诊断
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: android-release-lint-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            android/app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 3
      - name: 构建 R8 Release APK
        working-directory: android
        run: |
          set -euo pipefail
          rm -rf app/build/outputs/apk/release app/build/outputs/mapping/release
          # 本地继续使用低内存默认值；GitHub Runner 的全量 R8/native 构建采用
          # 与成熟发布链路一致的 4 GiB 有界堆和 2 个 worker。
          ./gradlew --no-daemon --build-cache --max-workers=2 \
            -Dorg.gradle.jvmargs="$CI_GRADLE_JVM_ARGS" :app:assembleRelease
          test -s app/build/outputs/mapping/release/mapping.txt || {
            echo '::error::Release R8 mapping is missing; refusing an unminified build.'
            exit 1
          }
      - name: 选择 Gradle 已签署的 Release APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apk_files < <(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print | sort)
          if (( ${#apk_files[@]} != 1 )); then
            echo '::error::Expected exactly one signed Release APK after assembleRelease.'
            printf 'Found %s APK files.\n' "${#apk_files[@]}"
            printf '%s\n' "${apk_files[@]}"
            exit 1
          fi
          input_apk="${apk_files[0]}"
          if [[ "$input_apk" == *-unsigned.apk || "$input_apk" == *debug*.apk ]]; then
            echo '::error::assembleRelease produced an unsigned or debug-named APK; CI never signs or promotes it.'
            exit 1
          fi
          output_apk="$RUNNER_TEMP/melora-android-v${{ steps.version.outputs.version }}-arm64-v8a.apk"
          cp -- "$input_apk" "$output_apk"
          [[ -s "$output_apk" ]] || { echo '::error::Gradle release APK is empty.'; exit 1; }
          echo "path=${output_apk}" >> "$GITHUB_OUTPUT"
      - name: 验证签名、包名、版本与非 Debug 属性
        id: verification
        env:
          MELORA_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          MELORA_EXPECTED_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          MELORA_PACKAGE_ID: com.leyu.melora
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export APKSIGNER="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          export AAPT2="$(find "$sdk_root/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          verification_log="$RUNNER_TEMP/melora-android-verification.txt"
          scripts/release/verify-android-apk.sh "${{ steps.apk.outputs.path }}" > "$verification_log"
          cat "$verification_log"
          certificate_digest="$(sed -nE 's/.*certificateSha256=([0-9A-Fa-f]+).*/\1/p' "$verification_log" | head -n 1)"
          [[ "$certificate_digest" =~ ^[0-9A-Fa-f]{64}$ ]] || {
            echo '::error::The Android verifier did not produce a certificate fingerprint.'
            exit 1
          }
          echo "certificate_sha256=${certificate_digest^^}" >> "$GITHUB_OUTPUT"
      - name: 准备公库 Release 资产
        id: artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/melora-android-artifacts"
          mkdir -p "$artifact_dir"
          apk_name="melora-android-v${RELEASE_VERSION}-arm64-v8a.apk"
          checksum_name="${apk_name}.sha256"
          cp -- "${{ steps.apk.outputs.path }}" "$artifact_dir/$apk_name"
          (cd "$artifact_dir" && sha256sum "$apk_name" > "$checksum_name")
          printf 'dir=%s\napk=%s\nchecksum=%s\nnotes=%s\n' \
            "$artifact_dir" "$artifact_dir/$apk_name" "$artifact_dir/$checksum_name" \
            "$artifact_dir/RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"
      - name: 导出已批准的 Android Release notes
        shell: bash
        run: |
          set -euo pipefail
          scripts/release/export-changelog-section.sh \
            --version "${{ steps.version.outputs.version }}" \
            --section '安卓客户端' \
            --output "${{ steps.artifacts.outputs.notes }}"
      - name: 上传已验证的发布资产
        id: upload
        uses: actions/upload-artifact@v4.6.2
        with:
          name: android-release-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.artifacts.outputs.dir }}/
          if-no-files-found: error
          # 发布失败后可单独重跑发布 job；诊断资产仍只保留 3 天。
          retention-days: 30
      - name: 上传短期 Android 构建诊断资产
        uses: actions/upload-artifact@v4.6.2
        with:
          name: android-release-mapping-${{ github.run_id }}-${{ github.run_attempt }}
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 3
      - name: 清理临时 keystore
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/melora-release.keystore"

  android-ci-result:
    needs: [prepare, verify, device-regression, release-build]
    if: ${{ always() && github.event.deleted != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 汇总 Android CI 结果
        shell: bash
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          DEVICE_RESULT: ${{ needs.device-regression.result }}
          BUILD_RESULT: ${{ needs.release-build.result }}
          RELEASE: ${{ needs.prepare.outputs.release }}
        run: |
          set -euo pipefail
          printf 'prepare=%s\nverify=%s\ndevice-regression=%s\nrelease-build=%s\n' \
            "$PREPARE_RESULT" "$VERIFY_RESULT" "$DEVICE_RESULT" "$BUILD_RESULT"
          [[ "$PREPARE_RESULT" == success && "$VERIFY_RESULT" == success && "$DEVICE_RESULT" == success ]]
          if [[ "$RELEASE" == true ]]; then
            [[ "$BUILD_RESULT" == success ]]
          else
            [[ "$RELEASE" == false && "$BUILD_RESULT" == skipped ]]
          fi

  release:
    needs: [prepare, release-build, android-ci-result]
    if: ${{ !cancelled() && needs.prepare.outputs.release == 'true' && needs.android-ci-result.result == 'success' && needs.release-build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release-build.outputs.version }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: 下载本次构建已验证的发布资产
        uses: actions/download-artifact@v4.3.0
        with:
          artifact-ids: ${{ needs.release-build.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/melora-android-artifacts
      - name: 创建、校验并发布同仓 Android Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/melora-android-artifacts"
          apk_name="melora-android-v${RELEASE_VERSION}-arm64-v8a.apk"
          python3 -B scripts/release/publish_android_release.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --version "$RELEASE_VERSION" \
            --apk "$artifact_dir/$apk_name" \
            --checksum "$artifact_dir/$apk_name.sha256" \
            --notes "$artifact_dir/RELEASE_NOTES.md" \
            --expected-commit "$(git rev-parse HEAD)" \
            --token-env GITHUB_TOKEN
